# Hot reload for kordinate. Watches kordinate's own sources ONLY.
#
# kore changes do NOT hot-reload. air cannot watch outside `root`, and
# core.css/templates are go:embed'ed into the binary — so editing the mounted
# /kore changes the file on disk while this process keeps serving the embedded
# copy it started with. A framework fix then looks applied (the mount has it)
# while every product still serves the old asset.
#
# After changing kore, restart the product: `docker compose restart <product>`.
# The Go build cache picks up the changed kore files on start.
# Hot reload for kordinate (the customer operations console).
root = "."
tmp_dir = "tmp"

[build]
# Stamp the version so the footer shows a real build identity rather than "dev".
# Derived from git at build time, so it tracks the tags instead of drifting.
cmd = "go build -ldflags \"-X github.com/krogio/kore/version.product=$(git describe --tags --always --dirty 2>/dev/null || echo dev) -X github.com/krogio/kore/version.commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)\" -o ./tmp/kordinate ./cmd/kordinate"
bin = "./tmp/kordinate"
include_ext = ["go", "html", "css", "js", "toml"]
exclude_dir = ["tmp", ".git"]
delay = 200

[log]
main_only = false

[misc]
clean_on_exit = true
